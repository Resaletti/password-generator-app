<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PassForge — Password Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="container">

    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">PassForge</span>
      </div>
      <p class="tagline">Cryptographically secure. Zero compromise.</p>
    </header>

    <!-- Output Display -->
    <section class="output-section">
      <div class="strength-bar-wrap">
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <span class="strength-label" id="strengthLabel">—</span>
      </div>

      <div class="password-display" id="passwordDisplay">
        <span class="password-text" id="passwordText">Click generate</span>
        <div class="display-actions">
          <button class="icon-btn" id="copyBtn" title="Copy to clipboard" aria-label="Copy password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button class="icon-btn" id="refreshBtn" title="Regenerate" aria-label="Regenerate password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="copy-toast" id="copyToast">Copied to clipboard!</div>
    </section>

    <!-- Controls -->
    <section class="controls-section">

      <!-- Length Slider -->
      <div class="control-group">
        <div class="control-label-row">
          <label for="lengthSlider" class="control-label">Length</label>
          <span class="control-value" id="lengthValue">16</span>
        </div>
        <div class="slider-wrap">
          <input type="range" id="lengthSlider" min="4" max="64" value="16" class="slider" />
          <div class="slider-track-fill" id="sliderTrack"></div>
        </div>
        <div class="slider-ticks">
          <span>4</span><span>16</span><span>32</span><span>48</span><span>64</span>
        </div>
      </div>

      <!-- Character Toggles -->
      <div class="control-group">
        <label class="control-label">Character Sets</label>
        <div class="toggles-grid">
          <label class="toggle-card" id="toggleUpper">
            <input type="checkbox" id="useUppercase" checked />
            <div class="toggle-card-inner">
              <span class="toggle-chars">ABC</span>
              <span class="toggle-name">Uppercase</span>
            </div>
            <div class="toggle-check">✓</div>
          </label>
          <label class="toggle-card" id="toggleLower">
            <input type="checkbox" id="useLowercase" checked />
            <div class="toggle-card-inner">
              <span class="toggle-chars">abc</span>
              <span class="toggle-name">Lowercase</span>
            </div>
            <div class="toggle-check">✓</div>
          </label>
          <label class="toggle-card" id="toggleNumbers">
            <input type="checkbox" id="useNumbers" checked />
            <div class="toggle-card-inner">
              <span class="toggle-chars">123</span>
              <span class="toggle-name">Numbers</span>
            </div>
            <div class="toggle-check">✓</div>
          </label>
          <label class="toggle-card" id="toggleSymbols">
            <input type="checkbox" id="useSymbols" />
            <div class="toggle-card-inner">
              <span class="toggle-chars">!@#</span>
              <span class="toggle-name">Symbols</span>
            </div>
            <div class="toggle-check">✓</div>
          </label>
        </div>
      </div>

      <!-- Extra Options -->
      <div class="control-group options-row">
        <label class="option-toggle">
          <input type="checkbox" id="excludeAmbiguous" />
          <span class="option-track"><span class="option-thumb"></span></span>
          <span class="option-label">Exclude ambiguous <em>(0, O, l, 1)</em></span>
        </label>
        <label class="option-toggle">
          <input type="checkbox" id="noRepeat" />
          <span class="option-track"><span class="option-thumb"></span></span>
          <span class="option-label">No repeating characters</span>
        </label>
      </div>

      <!-- Quantity -->
      <div class="control-group">
        <div class="control-label-row">
          <label class="control-label">Quantity</label>
          <span class="control-value" id="quantityValue">1</span>
        </div>
        <div class="slider-wrap">
          <input type="range" id="quantitySlider" min="1" max="10" value="1" class="slider" />
          <div class="slider-track-fill" id="quantityTrack"></div>
        </div>
      </div>

    </section>

    <!-- Generate Button -->
    <button class="generate-btn" id="generateBtn">
      <span class="btn-label">Generate Password</span>
      <span class="btn-icon">→</span>
    </button>

    <!-- Batch Output -->
    <section class="batch-section" id="batchSection" style="display:none">
      <div class="batch-header">
        <span class="control-label">Generated Passwords</span>
        <button class="text-btn" id="copyAllBtn">Copy all</button>
      </div>
      <ul class="batch-list" id="batchList"></ul>
    </section>

    <!-- Entropy Info -->
    <section class="entropy-section" id="entropySection" style="display:none">
      <div class="entropy-grid">
        <div class="entropy-item">
          <span class="entropy-val" id="entropyBits">—</span>
          <span class="entropy-key">Entropy (bits)</span>
        </div>
        <div class="entropy-item">
          <span class="entropy-val" id="poolSize">—</span>
          <span class="entropy-key">Character pool</span>
        </div>
        <div class="entropy-item">
          <span class="entropy-val" id="crackTime">—</span>
          <span class="entropy-key">Est. crack time</span>
        </div>
      </div>
    </section>

    <footer class="app-footer">
      Built with <code>crypto.getRandomValues()</code> · No data leaves your browser · Renato Oliveira
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
